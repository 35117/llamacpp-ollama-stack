<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>海龟汤 · 本地主持人</title>
<style>
  :root {
    --bg: #f4f1ec;
    --panel: #ffffff;
    --panel-2: #faf8f5;
    --ink: #2b2723;
    --ink-soft: #6b6259;
    --line: #e3ddd4;
    --accent: #8a5a3b;
    --accent-soft: #f0e6dd;
    --yes: #2f7a52;
    --yes-bg: #e8f4ec;
    --no: #a83a32;
    --no-bg: #fbeceb;
    --unknown: #7a6a55;
    --unknown-bg: #f2efe9;
    --shadow: 0 1px 2px rgba(43,39,35,.06), 0 8px 24px rgba(43,39,35,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1917;
      --panel: #24211e;
      --panel-2: #2b2825;
      --ink: #ece7e1;
      --ink-soft: #a49b90;
      --line: #3a3531;
      --accent: #c99873;
      --accent-soft: #33291f;
      --yes: #6cc79a; --yes-bg: #1e3329;
      --no: #e0857c;  --no-bg: #3a2321;
      --unknown: #b8ab99; --unknown-bg: #2f2b26;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 17px; margin: 0; font-weight: 650; letter-spacing: .5px; }
  h1 span { color: var(--accent); }
  .tag {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); border: 1px solid transparent;
    white-space: nowrap;
  }
  .spacer { flex: 1; }
  button {
    font: inherit; font-size: 14px; padding: 7px 15px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
    cursor: pointer; transition: .15s;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }

  main { flex: 1; overflow-y: auto; padding: 22px 20px 8px; }
  .wrap { max-width: 760px; margin: 0 auto; }

  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 18px;
  }
  .card h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--ink-soft); margin: 0 0 10px; font-weight: 600;
  }
  .surface { font-size: 17px; line-height: 1.85; margin: 0; }
  .bottom {
    font-size: 15px; line-height: 1.85; margin: 0;
    border-left: 3px solid var(--accent); padding-left: 14px; color: var(--ink);
  }

  .log { display: flex; flex-direction: column; gap: 12px; }
  .qa {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px 16px; animation: rise .22s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .q { color: var(--ink); margin-bottom: 8px; }
  .q::before { content: "问"; color: var(--ink-soft); font-size: 12px;
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; margin-right: 8px; }
  .a { display: flex; align-items: center; gap: 10px; }
  .verdict {
    font-size: 20px; font-weight: 700; padding: 3px 16px; border-radius: 8px;
    letter-spacing: 2px;
  }
  .verdict.yes { color: var(--yes); background: var(--yes-bg); }
  .verdict.no { color: var(--no); background: var(--no-bg); }
  .verdict.unknown { color: var(--unknown); background: var(--unknown-bg); }
  .verdict.part { color: var(--accent); background: var(--accent-soft); }
  .meta { font-size: 12px; color: var(--ink-soft); }

  /* 提示卡片：与问答明显区分，虚线框 + 强调色 */
  .hint-card {
    background: var(--accent-soft); border: 1px dashed var(--accent);
    border-radius: 12px; padding: 13px 16px; animation: rise .22s ease-out;
  }
  .hint-card .label {
    font-size: 11.5px; color: var(--accent); font-weight: 700;
    letter-spacing: 1px; margin-bottom: 6px;
  }
  .hint-card .text { font-size: 15.5px; line-height: 1.75; }

  /* 猜测评分卡：百分比 + 说对了什么 / 还差什么 */
  .guess-card {
    background: var(--panel); border: 1px solid var(--accent); border-radius: 12px;
    padding: 14px 16px; animation: rise .22s ease-out;
  }
  .guess-card .gt { font-size: 11.5px; color: var(--accent); font-weight: 700;
    letter-spacing: 1px; margin-bottom: 6px; }
  .guess-card .gq { font-size: 14.5px; margin-bottom: 10px; padding-left: 10px;
    border-left: 2px solid var(--line); color: var(--ink); }
  .guess-card .ga { display: flex; align-items: center; gap: 12px;
    margin-bottom: 4px; }
  .guess-card .gscore { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .guess-card .gscore.yes { color: var(--yes); }
  .guess-card .gscore.part { color: var(--accent); }
  .guess-card .gscore.unknown { color: var(--unknown); }
  .guess-card .gscore.no { color: var(--no); }
  .guess-card .glvl { font-size: 15px; font-weight: 600; color: var(--ink); }
  .guess-card .gb { font-size: 12px; color: var(--ink-soft); font-weight: 600;
    margin: 10px 0 3px; }
  .guess-card ul { margin: 0; padding-left: 18px; font-size: 13.5px;
    line-height: 1.7; }
  .guess-card .gnote { font-size: 12.5px; color: var(--ink-soft);
    margin-top: 6px; }

  /* 揭晓时才出现的「真相要点」 */
  .points { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.8; }
  .points li::marker { color: var(--accent); }

  .empty { color: var(--ink-soft); text-align: center; padding: 26px 0; font-size: 14px; }

  footer {
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 14px 20px 16px;
  }
  .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; }
  .composer input {
    flex: 1; font: inherit; padding: 11px 15px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
  }
  .composer input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .foot-row { max-width: 760px; margin: 9px auto 0; display: flex; gap: 10px;
    align-items: center; font-size: 12.5px; color: var(--ink-soft); flex-wrap: wrap; }
  .err { color: var(--no); }
  .busy { display: inline-flex; align-items: center; gap: 7px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* 模型切换面板 */
  .model-panel{ border-bottom:1px solid var(--line); background:var(--panel);
    padding:10px 18px; font-size:13px; }
  .model-panel .mp-row{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .model-panel label{ display:flex; gap:6px; align-items:center; color:var(--ink); }
  .model-panel select{ max-width:230px; padding:4px 6px; border:1px solid var(--line);
    border-radius:6px; background:#fff; color:var(--ink); font-size:13px; }
  .model-panel .mp-note{ margin-top:7px; color:#777; line-height:1.6; }
</style>
</head>
<body>
<header>
  <h1>海龟汤 · <span>本地主持人</span></h1>
  <span class="tag" id="cfg">加载中…</span>
  <div class="spacer"></div>
  <button id="btnModels">⚙ 模型</button>
  <button id="btnNew">换一题</button>
  <button id="btnReveal">揭晓汤底</button>
</header>

<div class="model-panel" id="modelPanel" style="display:none">
  <div class="mp-row">
    <label>判题 <select id="sel-judge"></select></label>
    <label>提示 <select id="sel-hint"></select></label>
    <label>打分 <select id="sel-grade"></select></label>
    <button id="btnModelClose">收起</button>
  </div>
  <div class="mp-note" id="modelNote">加载中…</div>
</div>

<main><div class="wrap">
  <div class="card" id="surfaceCard">
    <h2>汤面 <span class="tag" id="puzzleTag" style="margin-left:8px"></span></h2>
    <p class="surface" id="surface">正在加载题目…</p>
  </div>

  <div class="log" id="log"></div>
  <div class="empty" id="empty">还没有提问。用「是 / 不是」能问的问题来逼近真相。</div>

  <div class="card" id="bottomCard" style="display:none">
    <h2>汤底（真相）</h2>
    <p class="bottom" id="bottom"></p>
  </div>

  <div class="card" id="pointsCard" style="display:none">
    <h2>真相要点</h2>
    <ul class="points" id="points"></ul>
  </div>
</div></main>

<footer>
  <div class="composer">
    <input id="q" placeholder="问一个是非问题，例如：他是因为口渴才要水的吗？" autocomplete="off">
    <button class="primary" id="btnAsk">提问</button>
  </div>
  <div class="foot-row">
    <button id="btnHint" style="padding:4px 11px;font-size:12.5px">给点提示</button>
    <button id="btnGuess" style="padding:4px 11px;font-size:12.5px">我猜到答案了</button>
    <span id="status"></span>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let currentId = null;
let busy = false;
let labels = ["是", "否"];
let mode = "binary";
let askedList = [];      // 本局问过的问题，提示功能要参考它
let maxHints = 3;
let hintsUsed = 0;

const CLASS_OF = { "是": "yes", "否": "no", "无关": "unknown", "部分对": "part",
                   "一致": "yes", "不一致": "no" };

function setStatus(html, isErr) {
  $("status").innerHTML = html;
  $("status").className = isErr ? "err" : "";
}

function refreshHintBtn() {
  const left = Math.max(0, maxHints - hintsUsed);
  const b = $("btnHint");
  if (!b) return;
  b.textContent = left > 0 ? "给点提示（剩 " + left + " 次）" : "提示已用完";
  b.disabled = busy || left <= 0;
}

function setBusy(on) {
  busy = on;
  ["btnAsk", "btnNew", "btnReveal", "btnGuess"].forEach(id => {
    const el = $(id);
    if (el) el.disabled = on;
  });
  refreshHintBtn();
}

// 这个页面两种跑法都支持：
//   独立服务   http://127.0.0.1:11440         → API 在 /api
//   挂在桥上   http://127.0.0.1:11434/turtle  → API 在 /turtle/api
// 按当前路径自动选，不用维护两份页面。
const API_BASE = location.pathname.startsWith("/turtle") ? "/turtle/api" : "/api";

async function api(path, body) {
  const url = API_BASE + path.replace(/^\/api/, "");
  const opt = body
    ? { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) }
    : { method: "GET" };
  const r = await fetch(url, opt);
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || ("HTTP " + r.status));
  return data;
}

function addQA(question, label, ms) {
  $("empty").style.display = "none";
  const cls = CLASS_OF[label] || "unknown";
  const el = document.createElement("div");
  el.className = "qa";
  el.innerHTML =
    '<div class="q"></div>' +
    '<div class="a"><span class="verdict ' + cls + '"></span>' +
    '<span class="meta">' + (ms != null ? (ms / 1000).toFixed(2) + "s" : "") + "</span></div>";
  el.querySelector(".q").textContent = question;
  el.querySelector(".verdict").textContent = label;
  $("log").prepend(el);
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function addHint(text, isFallback) {
  $("empty").style.display = "none";
  const el = document.createElement("div");
  el.className = "hint-card";
  el.innerHTML = '<div class="label"></div><div class="text"></div>';
  el.querySelector(".label").textContent = isFallback ? "提示 · 通用方向" : "提示 · 主持人引导";
  el.querySelector(".text").textContent = text;
  $("log").prepend(el);
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function newPuzzle() {
  setBusy(true); setStatus("出题中…");
  try {
    const d = await api("/api/new", {});
    currentId = d.id;
    askedList = [];
    hintsUsed = 0;
    maxHints = d.max_hints || maxHints;
    const DL = { easy: "简单", medium: "中等", hard: "困难" };
    const parts = [];
    if (d.difficulty) parts.push(DL[d.difficulty] || d.difficulty);
    if (d.model) parts.push("判题 " + d.model);
    $("puzzleTag").textContent = parts.join(" · ");
    $("surface").textContent = d.surface;
    $("log").innerHTML = "";
    $("empty").style.display = "";
    $("empty").textContent = "还没有提问。用「是 / 不是」能问的问题来逼近真相。";
    $("bottomCard").style.display = "none";
    $("bottom").textContent = "";
    $("q").value = "";
    setStatus("");
    $("q").focus();
  } catch (e) { setStatus("出题失败：" + e.message, true); }
  setBusy(false);
}

async function ask() {
  const question = $("q").value.trim();
  if (!question || busy) return;
  setBusy(true); setStatus("主持人思考中…");
  try {
    const d = await api("/api/ask", { puzzle_id: currentId, question });
    askedList.push(question);
    addQA(question, d.label, d.ms);
    $("q").value = "";
    setStatus("");
  } catch (e) { setStatus("判题失败：" + e.message, true); }
  setBusy(false);
  $("q").focus();
}

async function hint() {
  if (busy || hintsUsed >= maxHints) return;
  setBusy(true); setStatus("正在想一个引导你的问题…");
  try {
    const d = await api("/api/hint", { puzzle_id: currentId, asked: askedList });
    hintsUsed = d.used;
    addHint(d.text, !!d.fallback);
    setStatus(d.fallback
      ? "（模型两次都绕着真相要素打转，已换成通用方向）"
      : "");
  } catch (e) { setStatus("取提示失败：" + e.message, true); }
  setBusy(false);
  $("q").focus();
}

// 猜测评分卡：**只给百分比和条数**。
// 检查点内容不在猜完时展示 —— 那就是把汤底拆开念给玩家听，猜一半就全剧透了。
// 要点留到点「揭晓汤底」时一起公布。
function addGuess(guessText, d) {
  $("empty").style.display = "none";
  const score = (d.score != null) ? d.score : 0;
  const tone = score >= 100 ? "yes" : (score >= 50 ? "part"
               : (score > 0 ? "unknown" : "no"));
  let note;
  if (d.graded) {
    note = "说中了 " + d.hit + " / " + d.total + " 个要点";
    if (score < 100) note += "　—— 具体差在哪，揭晓后可以看到";
  } else {
    note = score >= 100 ? "完全正确" : "还不太对";
  }

  const el = document.createElement("div");
  el.className = "guess-card";
  el.innerHTML =
    '<div class="gt">我的猜测</div>' +
    '<div class="gq"></div>' +
    '<div class="ga"><span class="gscore ' + tone + '">' + score + '%</span>' +
    '<span class="glvl"></span>' +
    '<span class="meta">' + (d.ms != null ? (d.ms / 1000).toFixed(2) + "s" : "") +
    "</span></div>" +
    '<div class="gnote"></div>';
  el.querySelector(".gq").textContent = guessText;
  el.querySelector(".glvl").textContent = d.level || "";
  el.querySelector(".gnote").textContent = note;

  $("log").prepend(el);
  el.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

async function guess() {
  if (busy) return;
  const g = window.prompt("写下你认为的完整真相：");
  if (!g || !g.trim()) return;
  setBusy(true); setStatus("正在比对你的猜测…");
  try {
    const d = await api("/api/guess", { puzzle_id: currentId, guess: g.trim() });
    addGuess(g.trim(), d);
    if (d.score >= 100) {
      setStatus("满分！下面揭晓汤底。");
      await reveal();
    } else if (d.score >= 75) {
      setStatus("很接近了 —— 再补上缺的那部分，或者直接揭晓。");
    } else {
      setStatus("还没对上，再想想。");
    }
  } catch (e) { setStatus("比对失败：" + e.message, true); }
  setBusy(false);
}

async function reveal() {
  if (busy) return;
  setBusy(true);
  try {
    const d = await api("/api/reveal", { puzzle_id: currentId });
    $("bottom").textContent = d.bottom;
    $("bottomCard").style.display = "";
    // 真相要点（检查点）到这一步才公布
    const cps = d.checkpoints || [];
    const card = $("pointsCard");
    if (cps.length) {
      const ul = $("points");
      ul.innerHTML = "";
      cps.forEach((c) => {
        const li = document.createElement("li");
        li.textContent = c;
        ul.appendChild(li);
      });
      card.style.display = "";
    } else {
      card.style.display = "none";
    }
    $("bottomCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
    setStatus("");
  } catch (e) { setStatus("揭晓失败：" + e.message, true); }
  setBusy(false);
}

// 后台预热判题模型：首次判题要冷加载十几秒，这里提前把它拉进显存。
// 不阻塞界面 —— 失败也不影响玩（只是首次提问会慢）。
function warmupInBackground() {
  const tag = $("cfg");
  const base = tag.textContent;
  tag.textContent = base + " · 准备中…";
  fetch(API_BASE + "/warmup", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: "{}",
  }).then(() => { tag.textContent = base + " · 就绪"; })
    .catch(() => { tag.textContent = base; });
}

let modeName = "";
function setCfgTag(cfg) {
  $("cfg").textContent = (cfg.model_desc || cfg.model) + " · " + modeName
    + " · " + (cfg.mode_labels || []).join("/");
}

// ---------------- 模型切换 ----------------
// 三个角色（判题 / 提示 / 打分）可以分别指定模型；
// 「自动」= 判题按题目难度取默认，提示/打分回落到各自默认。
let modelInfo = null;

async function loadModels() {
  const d = await api("/models");
  modelInfo = d;
  ["judge", "hint", "grade"].forEach((role) => {
    const sel = $("sel-" + role);
    sel.innerHTML = "";
    const o = document.createElement("option");
    o.value = "auto";
    o.textContent = (d.auto && d.auto.label) || "自动";
    o.title = (d.auto && d.auto.desc) || "";
    sel.appendChild(o);
    (d.models || []).forEach((m) => {
      const op = document.createElement("option");
      op.value = m.id;
      op.textContent = (m.label || m.id)
        + (m.size_gb ? "（" + m.size_gb + "GB）" : "");
      if (m.note) op.title = m.note;
      sel.appendChild(op);
    });
    sel.value = (d.roles && d.roles[role]) || "auto";
  });
  const lm = {};
  (d.models || []).forEach((m) => { lm[m.id] = m.label || m.id; });
  modelInfo.labels = lm;
  const eff = d.effective || {};
  $("modelNote").textContent =
    "判题「自动」= 按题目难度取默认。当前生效：判题 "
    + (lm[eff.judge] || eff.judge) + " / 提示 " + (lm[eff.hint] || eff.hint)
    + " / 打分 " + (lm[eff.grade] || eff.grade)
    + "。换模型首次会等十几秒（显存里换载）。";
}

async function applyModelSettings() {
  setBusy(true);
  try {
    const d = await api("/settings", {
      judge_model: $("sel-judge").value,
      hint_model: $("sel-hint").value,
      grade_model: $("sel-grade").value,
    });
    const cfg = await api("/config");
    setCfgTag(cfg);
    await loadModels();
    setStatus("模型已切换");
  } catch (e) {
    setStatus("切换模型失败：" + e.message, true);
  }
  setBusy(false);
}

async function boot() {
  try {
    const d = await api("/config");
    labels = d.mode_labels;
    mode = d.mode;
    maxHints = d.max_hints || 3;
    modeName = { binary: "是非题", three: "含「无关」", four: "含「部分对」" }[mode] || mode;
    setCfgTag(d);
    warmupInBackground();
    try { await loadModels(); } catch (e2) { /* 模型清单拿不到不影响玩 */ }
    if (mode === "binary") {
      $("empty").textContent =
        "还没有提问。本模式把「无关」并入「不是」——问「是 / 不是」能答的问题来逼近真相。";
    }
  } catch (e) {
    // 直接双击打开这个 html（服务没跑）时会走到这里 —— 给明确指引，别只报错
    $("cfg").textContent = "判题服务未启动";
    $("surface").innerHTML =
      "读不到判题服务（11440）。<br>请先双击 <code>turtle\\start.bat</code>，" +
      "它会自动打开 <a href=\"http://127.0.0.1:11440\">http://127.0.0.1:11440</a>。<br>" +
      "本页面必须由 <code>turtle/server.py</code> 提供服务，直接打开文件是不行的。";
    $("empty").style.display = "none";
    setStatus("提示：服务未启动（" + e.message + "）", true);
    return;
  }
  await newPuzzle();
}

$("btnAsk").onclick = ask;
$("btnNew").onclick = newPuzzle;
$("btnReveal").onclick = reveal;
$("btnGuess").onclick = guess;
$("btnHint").onclick = hint;
$("btnModels").onclick = () => {
  const p = $("modelPanel");
  p.style.display = (p.style.display === "none") ? "" : "none";
};
$("btnModelClose").onclick = () => { $("modelPanel").style.display = "none"; };
["sel-judge", "sel-hint", "sel-grade"].forEach((id) => {
  $(id).addEventListener("change", applyModelSettings);
});
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });

boot();
</script>
</body>
</html>
